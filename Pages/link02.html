<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Orbit | Stoat Labo</title>
    
  <!-- ファビコンの設定 -->
  <link rel="icon" href="../images/icon.png" type="image/x-icon">

  <!-- Open Graph Protocol (OGP) の設定 -->
  <meta property="og:title" content="Stoat Labo | Web創作支援サイト">
  <meta property="og:description" content="同人作家向けWebサイト用テンプレート配布＆Webツール公開サイトです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stoatpolice2.github.io/labo/">
  <meta property="og:image" content="https://stoatpolice2.github.io/labo/images/ogp.jpg">
  <meta property="og:site_name" content="Stoat Labo">
  <meta property="og:locale" content="ja_JP">
    
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    /* --------------------------------------------------
       1. 全体・深宇宙背景設定
    -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      /* 宇宙風のダークグラデーション背景 */
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 星くずエフェクト（背景の微小なキラキラ） */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* --------------------------------------------------
       2. メインコンテナ
    -------------------------------------------------- */
    .orbit-container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin-top: auto;
      margin-bottom: auto;
      z-index: 1;
    }

    /* --------------------------------------------------
       3. 中心星（プロフィール）
    -------------------------------------------------- */
    .sun-profile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      box-shadow: 0 0 30px rgba(79, 172, 254, 0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(79, 172, 254, 0.9);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid #090a0f;
    }

    .name-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-top: 14px;
      background: linear-gradient(90deg, #ffffff, #89f7fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(137, 247, 254, 0.3);
    }

    /* --------------------------------------------------
       4. 自己紹介テキスト（ホログラムガラス風）
    -------------------------------------------------- */
    .bio-glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 18px 24px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #e0e6ed;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    /* --------------------------------------------------
       5. 惑星（SNSリンク）オービットシステム
    -------------------------------------------------- */
    .orbit-system {
      position: relative;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding: 20px 0;
    }

    /* 各惑星（リンクボタン） */
    .planet-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      text-decoration: none;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 30px;
      background: rgba(20, 26, 40, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    /* ホバー時の光彩（ネオン発光） */
    .planet-link::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .planet-link:hover::before {
      left: 100%;
    }

    .planet-link:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: var(--planet-color);
      box-shadow: 0 0 20px var(--planet-glow);
    }

    /* 惑星アイコンの光る球体表現 */
    .planet-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--planet-color);
      box-shadow: 0 0 10px var(--planet-color);
    }

    /* 個別テーマカラー定義（ネオンカラー） */
    .plt-site    { --planet-color: #ffd54f; --planet-glow: rgba(255, 213, 79, 0.6); }   /* イエロー */
    .plt-x       { --planet-color: #ffffff; --planet-glow: rgba(255, 255, 255, 0.6); }   /* ホワイト */
    .plt-insta   { --planet-color: #ff4081; --planet-glow: rgba(255, 64, 129, 0.6); }   /* マゼンタ */
    .plt-pixiv   { --planet-color: #00e5ff; --planet-glow: rgba(0, 229, 255, 0.6); }   /* シアン */
    .plt-bsky    { --planet-color: #40c4ff; --planet-glow: rgba(64, 196, 255, 0.6); }   /* ライトブルー */
    .plt-misskey { --planet-color: #ea80fc; --planet-glow: rgba(234, 128, 252, 0.6); }  /* ライラック */
    .plt-masto   { --planet-color: #b388ff; --planet-glow: rgba(179, 136, 255, 0.6); }  /* パープル */
    .plt-mail    { --planet-color: #ff9100; --planet-glow: rgba(255, 145, 0, 0.6); }   /* ネオンオレンジ */

    /* レスポンシブ */
    @media (max-width: 480px) {
      .avatar-wrapper {
        width: 100px;
        height: 100px;
      }
      .name-title {
        font-size: 1.3rem;
      }
      .planet-link {
        padding: 10px 16px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="orbit-container">
    
    <!-- 中心星：プロフィール -->
    <div class="sun-profile">
      <div class="avatar-wrapper">
        <img src="../images/icon.png" alt="プロフィール画像">
      </div>
      <div class="name-title">your name</div>
    </div>

    <!-- ホログラム風自己紹介メモ -->
    <div class="bio-glass">
      <p>
        ここに自己紹介などを入力してください。<br><br>※こちらのデモページに掲載している画像はフリー素材をお借りしたものです。テンプレートを使用する際はご自身で用意した画像に差し替えてください。
      </p>
    </div>

    <!-- 8つの惑星リンク集 -->
    <div class="orbit-system">
      <a href="#" class="planet-link plt-site">
        <span class="planet-dot"></span>🌐 Web Site
      </a>
      <a href="#" class="planet-link plt-x">
        <span class="planet-dot"></span>𝕏 (Twitter)
      </a>
      <a href="#" class="planet-link plt-insta">
        <span class="planet-dot"></span>📷 Instagram
      </a>
      <a href="#" class="planet-link plt-pixiv">
        <span class="planet-dot"></span>🎨 pixiv
      </a>
      <a href="#" class="planet-link plt-bsky">
        <span class="planet-dot"></span>🦋 BlueSky
      </a>
      <a href="#" class="planet-link plt-misskey">
        <span class="planet-dot"></span>🚀 Misskey
      </a>
      <a href="#" class="planet-link plt-masto">
        <span class="planet-dot"></span>🐘 Mastodon
      </a>
      <a href="#" class="planet-link plt-mail">
        <span class="planet-dot"></span>✉️ Mail Form
      </a>
    </div>

  </div>
  <br>
  
<footer>
      <p>Template by <a href="https://stoatpolice2.github.io/labo/" target="_blank">Stoat Labo</a></p>
    </footer>
</body>
</html>
