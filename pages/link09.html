<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Style | Stoat Labo</title>
    
    <!-- ファビコンの設定 -->
    <link rel="icon" href="../images/icon.webp" type="image/x-icon">

    <!-- Open Graph Protocol (OGP) の設定 -->
    <meta property="og:title" content="Stoat Labo | Web創作支援サイト">
    <meta property="og:description" content="同人作家向けWebサイト用テンプレート配布＆Webツール公開サイト">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stoatpolice2.github.io/labo/">
    <meta property="og:image" content="../images/ogp.webp">
    <meta property="og:site_name" content="Stoat Labo">
    <meta property="og:locale" content="ja_JP">
    
    <style>
        /* --- 基本スタイルと背景画像の設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* フォント構成 */
            font-family: "Trebuchet MS", "Arial Bold", "Yu Gothic", "Meiryo", sans-serif;
            color: #111111;
            /* 背景画像（任意の画像URLに変更してください） */
            background-image: url('../images/picture13.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
            min-height: 100vh;
        }

        /* 全体コンテナ */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* --- 共通カードスタイル --- */
        .card-style {
            background-color: #ffffff;
            border: 2px solid #111111;
            border-radius: 0px;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.85);
            width: 100%;
        }

        /* --- プロフィールセクション --- */
        .profile-card {
            padding: 28px 20px;
            text-align: center;
        }

        .profile-image-wrapper {
            margin-bottom: 16px;
        }

        .profile-image {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #111111;
        }

        .profile-name {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #000000;
        }

        .profile-comment {
            font-size: 0.85rem;
            line-height: 1.6;
            font-weight: 600;
            color: #333333;
            white-space: pre-wrap;
        }

        /* --- ポラロイド風 3×3 リンクグリッド --- */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
        }

        .link-card {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 8px 8px 12px 8px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        /* ホバー時に押し込むようなアクション */
        .link-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px rgba(0, 0, 0, 1);
        }

        .link-card:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 1);
        }

        .link-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ポラロイドの写真部分 */
        .link-image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid #111111;
            background-color: #eee;
        }

        .link-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(105%);
        }

        /* ポラロイドの下部テキスト */
        .link-title {
            margin-top: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-align: center;
            word-break: break-all;
            color: #111111;
            text-transform: uppercase;
        }

        /* レスポンシブ微調整 */
        @media (min-width: 600px) {
            .container {
                max-width: 520px;
            }
            .links-grid {
                gap: 18px;
            }
            .link-title {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- プロフィールカード -->
        <div class="card-style profile-card">
            <div class="profile-image-wrapper">
                <img src="../images/icon.webp" alt="プロフィール画像" class="profile-image">
            </div>
            <h1 class="profile-name">Your Name</h1>
            <p class="profile-comment">ここに自己紹介などを入力してください。<br><br>
        ※こちらのデモページに掲載している画像はフリー素材をお借りしたものです。テンプレートを使用する際はご自身で用意した画像に差し替えてください。</p>
        </div>

        <!-- 3×3 リンク用グリッド -->
        <div class="links-grid" id="linksContainer">
        </div>
        
        <!-- フッター -->
        <footer class="pudding-footer">
          <p>Template by <a href="https://stoatpolice2.github.io/labo/" target="_blank" style="color: inherit; text-decoration: none;">Stoat Labo</a>
        </footer>
        
    </div>

    <script>
        // 9つのリンクデータ
        const linkItems = [
            {
                title: "X (Twitter)",
                url: "#",
                img: "../images/picture04.webp?text=X"
            },
            {
                title: "Bluesky",
                url: "#",
                img: "../images/picture08.webp?text=Bluesky"
            },
            {
                title: "Instagram",
                url: "#",
                img: "../images/picture01.webp?text=Instagram"
            },
            {
                title: "YouTube",
                url: "#",
                img: "../images/picture03.webp?text=YouTube"
            },
            {
                title: "Pixiv",
                url: "#",
                img: "../images/picture04.webp?text=Pixiv"
            },
            {
                title: "BOOTH",
                url: "#",
                img: "../images/picture11.webp?text=BOOTH"
            },
            {
                title: "Website",
                url: "#",
                img: "../images/picture12.webp?text=Website"
            },
            {
                title: "Blog",
                url: "#",
                img: "../images/picture07.webp?text=Blog"
            },
            {
                title: "Mail",
                url: "#",
                img: "../images/picture09.webp?text=Mail"
            }
        ];

        const container = document.getElementById('linksContainer');

        linkItems.forEach(item => {
            const card = document.createElement('a');
            card.className = 'card-style link-card';
            card.href = item.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';

            card.innerHTML = `
                <div class="link-card-content">
                    <div class="link-image-container">
                        <img src="${item.img}" alt="${item.title}" class="link-image">
                    </div>
                    <div class="link-title">${item.title}</div>
                </div>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
