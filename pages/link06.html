  <style>
    /* ==========================================
       RESET & VARIABLES
       ========================================== */
    :root {
      --primary-color: #040c1a;  /* 深い藍色 */
      --secondary-color: #ffffff;
      --accent-color: #d4af37;   /* ゴールド */
      --accent-light: #f3e5ab;
      --text-color: #2c3038;
      --text-light: #7a828e;
      --bg-light: #f4f6f9;
      --font-gothic: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      --font-serif: "Times New Roman", Times, "YuMincho", "Hiragino Mincho ProN", serif;
      --transition-smooth: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-gothic);
      /* リンク集は高級感のあるダーク背景で統一 */
      background-color: var(--primary-color);
      color: var(--secondary-color);
      line-height: 1.8;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    /* 背景の透かし文字 */
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80vw;
      font-weight: 900;
      font-style: italic;
      font-family: var(--font-serif);
      color: rgba(255, 255, 255, 0.02);
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    @media (min-width: 600px) {
      .bg-watermark { font-size: 50vw; }
    }

    /* 鏡面リフレクション */
    .reflection-text {
      background: linear-gradient(
        120deg,
        rgba(212, 175, 55, 0.6) 0%,
        rgba(255, 255, 255, 0.95) 45%,
        rgba(212, 175, 55, 1) 55%,
        rgba(243, 229, 171, 0.7) 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shineReflection 4s linear infinite;
    }

    @keyframes shineReflection {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* グロッシーカード */
    .glossy-shine-box {
      position: relative;
      overflow: hidden;
    }

    .glossy-shine-box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      transition: var(--transition-smooth);
      pointer-events: none;
    }

    .glossy-shine-box:hover::after {
      left: 130%;
      transition: all 0.9s ease-in-out;
    }

    /* ==========================================
       LINK PORTAL LAYOUT
       ========================================== */
    .portal-container {
      max-width: 540px;
      width: 100%;
      padding: 50px 20px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* 1. プロフィールエリア */
    .profile-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-box {
      width: 110px;
      height: 110px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .profile-name .number {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.8rem;
      margin-left: 6px;
    }

    .profile-bio {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      font-weight: 300;
    }

    /* 2. リンクボタンリスト */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* カードデザイン */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      text-decoration: none;
      color: var(--secondary-color);
      transition: var(--transition-smooth);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .link-card:hover {
      border-color: rgba(212, 175, 55, 0.8);
      background: rgba(255,255,255,0.06);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .link-left {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    /* ナンバリング */
    .link-num {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
    }

    .link-label {
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .link-arrow {
      color: var(--accent-color);
      font-family: var(--font-serif);
      font-size: 1.2rem;
      opacity: 0.5;
      transition: var(--transition-smooth);
      transform: translateX(-5px);
    }

    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* 3. フッター */
    .portal-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .sponsor-logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

  </style>
</head>
