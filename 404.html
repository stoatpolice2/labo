<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | ページが見つかりません</title>
    
  <!-- ファビコンの設定 -->
  <link href="https://stoatpolice2.github.io/labo/images/icon.webp" rel="icon" type="image/x-icon"/>

  <!-- Open Graph Protocol (OGP) の設定 -->
  <meta content="Stoat Labo | Web創作支援サイト" property="og:title"/>
  <meta content="同人作家向けWebサイト用テンプレート配布＆Webツール公開サイト" property="og:description"/>
  <meta content="website" property="og:type"/>
  <meta content="https://stoatpolice2.github.io/labo/" property="og:url"/>
  <meta content="https://stoatpolice2.github.io/labo/images/ogp.webp" property="og:image"/>
  <meta content="Stoat Labo" property="og:site_name"/>
  <meta content="ja_JP" property="og:locale"/>
    
  <style>
    /* 全体設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #f7f9f8; /* 画像背景に合わせたやわらかい背景色 */
      color: #4a4a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* メインカード容器 */
    .error-card {
      background-color: #ffffff;
      max-width: 540px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 2px solid #e2ece9;
      text-align: center;
    }

    /* 404イラスト画像 */
    .error-image {
      width: 100%;
      max-width: 320px; /* PC画面で綺麗に見える表示サイズ */
      height: auto;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    /* タイトル & テキスト */
    .error-title {
      font-size: 1.8rem;
      color: #5b8a7f; /* オコジョの服のグリーン系アクセント */
      margin-bottom: 12px;
      font-weight: bold;
    }

    .error-message {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #666666;
      margin-bottom: 30px;
    }

    /* トップページへ戻るボタン */
    .btn-home {
      display: inline-block;
      padding: 14px 36px;
      background-color: #6ba899; /* イラストのテーマに合わせたカラー */
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 4px 12px rgba(107, 168, 153, 0.3);
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background-color: #589284;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 168, 153, 0.4);
    }

    /* スマホ対応 */
    @media (max-width: 480px) {
      .error-card {
        padding: 30px 20px;
      }
      .error-title {
        font-size: 1.5rem;
      }
      .error-image {
        max-width: 260px;
      }
    }
  </style>
</head>
<body>

  <main class="error-card">
    <img src="https://stoatpolice2.github.io/labo/images/404.webp" alt="404 Not Found" class="error-image">

    <h1 class="error-title">404 Not Found</h1>
    
    <p class="error-message">
      お探しのページは移動または削除された可能性があります。<br>
      URLに間違いがないかご確認ください。
    </p>

    <a href="https://stoatpolice2.github.io/labo/" class="btn-home">トップページへ戻る</a>
  </main>

</body>
</html>
