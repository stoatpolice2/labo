<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かんたんコード整形＆クリーナー | Stoat Labo</title>
    
    <!-- ファビコンの設定 -->
    <link rel="icon" href="../images/icon.png" type="image/x-icon">

    <!-- Open Graph Protocol (OGP) の設定 -->
    <meta property="og:title" content="Stoat Labo | Web創作支援サイト">
    <meta property="og:description" content="同人作家向けWebサイト用テンプレート配布＆Webツール公開サイト">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stoatpolice2.github.io/labo/">
    <meta property="og:image" content="../images/ogp.jpg">
    <meta property="og:site_name" content="Stoat Labo">
    <meta property="og:locale" content="ja_JP">

    <!-- js-beautify ライブラリ (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>

    <style>
        /* ----------------------------------
            Stoat Labo COLOR SYSTEM
        ---------------------------------- */
        :root {
          --primary: #E06D53;
          --primary-hover: #C8563C;
          --accent: #E8963E;
          --bg-main: #FAF7F5;
          --bg-card: #FFFFFF;
          --text-main: #332C2B;
          --text-muted: #7A6E6B;
          --border: #E6DAD3;
          --grad-primary: linear-gradient(135deg, #E06D53 0%, #E8963E 100%);
          --grad-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
            color: var(--text-main);
            line-height: 1.6;
            background-color: var(--bg-main);
            background-image: radial-gradient(#E8DDD7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        h1 {
            font-size: 24px;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 12px;
            display: inline-block;
        }

        /* 説明文エリア */
        .intro-box {
            background-color: var(--grad-bg);
            border-left: 5px solid var(--primary);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .intro-box p {
            margin: 0 0 10px 0;
            font-size: 15px;
        }

        .intro-box p:last-child {
            margin-bottom: 0;
        }

        .features {
            margin: 10px 0 0 0;
            list-style: none;
            padding-left: 0;
            font-size: 14px;
            color: var(--text-main);
        }

        .features li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 4px;
        }

        .features li::before {
            content: "🐾";
            position: absolute;
            left: 0;
            font-size: 0.85rem;
        }

        /* 設定カードエリア */
        .config-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(224, 109, 83, 0.08);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .config-box label {
            font-weight: bold;
            color: var(--text-main);
            font-size: 15px;
        }

        select {
            padding: 8px 16px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #FFF6F3;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* エディタエリア */
        .editor-container {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 680px) {
            .editor-container {
                flex-direction: column;
            }
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .label-row label {
            font-size: 14px;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 380px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: var(--bg-card);
            color: var(--text-main);
            resize: vertical;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(224, 109, 83, 0.15);
        }

        textarea[readonly] {
            background-color: #FAF8F7;
        }

        /* アクションボタン類 */
        .controls-bottom {
            text-align: center;
            margin-bottom: 30px;
        }

        .action-btn {
            display: inline-block;
            padding: 12px 36px;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(224, 109, 83, 0.25);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(224, 109, 83, 0.35);
        }

        .copy-btn {
            display: inline-block;
            padding: 4px 12px;
            background: var(--bg-main);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .copy-btn.success {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>かんたんコード整形＆クリーナー</h1>

    <!-- 説明文エリア -->
    <div class="intro-box">
        <p>✨ <strong>Web制作やサイト更新の下準備をちょっと快適に！</strong></p>
        <p>インデントが崩れたコードや、不要な空タグ・無駄なスペースが含まれたコードを一瞬で綺麗に整列・修正する無料ツールです。</p>
        <ul class="features">
            <li><strong>安心安全:</strong> コードはサーバーに送信されず、お使いのブラウザ内で処理されるためプライバシーも安心です。</li>
            <li><strong>3言語対応:</strong> HTML、CSS、JavaScriptに対応。言語が混在している場合は「HTML」を選択してください。</li>
        </ul>
    </div>

    <!-- 設定エリア -->
    <div class="config-box">
        <label for="language-select">1. 整理したい言語を選択:</label>
        <select id="language-select">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">JavaScript</option>
        </select>
    </div>

    <!-- エディタエリア -->
    <div class="editor-container">
        <div class="editor-box">
            <div class="label-row">
                <label for="input-code"><strong>2. 整理前のコードを入力:</strong></label>
            </div>
            <textarea id="input-code" placeholder="ここにコードを貼り付けてください..."></textarea>
        </div>
        
        <div class="editor-box">
            <div class="label-row">
                <label for="output-code"><strong>3. 整理後のコード:</strong></label>
                <button id="copy-btn" class="copy-btn" onclick="copyToClipboard()">コピー</button>
            </div>
            <textarea id="output-code" readonly placeholder="「綺麗に整理する」を押すとここに結果が表示されます..."></textarea>
        </div>
    </div>

    <!-- 実行ボタン -->
    <div class="controls-bottom">
        <button class="action-btn" onclick="processCode()">🐾 コードを綺麗に整理する</button>
    </div>

    <footer>
        <p>&copy; Stoat Labo / okojo All Rights Reserved.</p>
    </footer>

    <script>
        function processCode() {
            let code = document.getElementById('input-code').value;
            const lang = document.getElementById('language-select').value;

            if (!code.trim()) return;

            // 前処理 (無駄な行末空白の除去)
            code = code.replace(/[ \t]+$/gm, '');
            
            // HTMLの場合は空タグを消去
            if (lang === 'html') {
                code = code.replace(/<(\w+)\s*><\/\1>/g, '');
            }

            // js-beautify オプション（インデント幅2つ）
            const options = {
                indent_size: 2,
                space_in_empty_paren: false,
                end_with_newline: true
            };

            let formatted = '';
            if (lang === 'html') {
                formatted = html_beautify(code, options);
            } else if (lang === 'css') {
                formatted = css_beautify(code, options);
            } else if (lang === 'js') {
                formatted = js_beautify(code, options);
            }

            document.getElementById('output-code').value = formatted;
        }

        async function copyToClipboard() {
            const outputText = document.getElementById('output-code').value;
            const copyBtn = document.getElementById('copy-btn');

            if (!outputText) return;

            try {
                await navigator.clipboard.writeText(outputText);
                copyBtn.textContent = 'コピーしました！';
                copyBtn.classList.add('success');

                setTimeout(() => {
                    copyBtn.textContent = 'コピー';
                    copyBtn.classList.remove('success');
                }, 2000);
            } catch (err) {
                alert('コピーに失敗しました: ' + err);
            }
        }
    </script>
</body>
</html>
